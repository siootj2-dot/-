.mandu{width:170px!important;height:170px!important;animation:manduIdle 2.3s ease-in-out infinite}
.mandu:before,.mandu .eye,.mandu .mouth{display:none!important}
.manduArt{width:150px;height:150px;filter:drop-shadow(0 12px 12px #0008);animation:manduIdle 2.3s ease-in-out infinite}
@keyframes manduIdle{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-7px) rotate(1deg)}}
@keyframes manduAttack{0%{transform:translateX(0) rotate(0)}35%{transform:translateX(28px) rotate(-7deg) scale(1.08)}65%{transform:translateX(-5px) rotate(3deg)}100%{transform:translateX(0)}}
@keyframes manduHit{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px) rotate(-5deg)}45%{transform:translateX(10px) rotate(4deg)}70%{transform:translateX(-7px)}}
@keyframes manduWin{0%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(-20px) scale(1.08) rotate(-5deg)}60%{transform:translateY(-4px) scale(1.03) rotate(4deg)}}
.motion-attack{animation:manduAttack .55s ease!important}.motion-hit{animation:manduHit .5s ease!important}.motion-win{animation:manduWin .8s ease!important}
.battle-stage{margin:12px 0 14px;min-height:190px;border-radius:18px;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:
linear-gradient(#ffffff0a,#00000022),
radial-gradient(circle at 50% 100%,#74945444,transparent 45%),
linear-gradient(180deg,#34482b,#202c1d);border:1px solid #6f5a3f;overflow:hidden;position:relative}
.battle-stage:after{content:"";position:absolute;left:8%;right:8%;bottom:22px;height:20px;background:#0005;filter:blur(12px);border-radius:50%}
.battle-stage>*{position:relative;z-index:1}
.enemyArt{font-size:76px;filter:drop-shadow(0 10px 8px #0007);animation:enemyIdle 1.8s ease-in-out infinite}
@keyframes enemyIdle{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.vs{font-weight:1000;font-size:24px;color:#ffd36b;text-shadow:0 2px 0 #543}
.card h3,.card h2{letter-spacing:-.4px}
@media(max-width:620px){.mandu{width:130px!important;height:130px!important}.manduArt{width:120px;height:120px}.enemyArt{font-size:58px}.battle-stage{min-height:160px;padding:8px 12px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="row space"><h2>맛의 대륙 <span class="badge">v0.1</span></h2><div>🪙 <b id="gold"></b>　⏳ <b id="time"></b>　🔬 <b id="rp"></b></div></div>
  <section id="home" class="view active"><div class="card hero"><div class="mandu" id="mandu"><i class="eye l"></i><i class="eye r"></i><i class="mouth"></i></div><div><h3 id="name">기본만두</h3><div class="small" id="role">자유 레시피</div><div class="row space"><span>Lv.<b id="lv"></b></span><span id="expText"></span></div><div class="bar"><div class="fill" id="expBar"></div></div><div id="statText" style="margin-top:8px"></div></div></div><div class="card"><div class="row space"><h3>현재 레시피</h3><span>용량 <b id="used"></b>/<b id="max"></b></span></div><div class="slots" id="equip"></div><div class="small" style="margin-top:8px">재료를 빼면 소멸하는 프로토 규칙.</div></div><div class="card"><div class="row space"><h3>보유 식재료</h3><button onclick="starter()">테스트 보급</button></div><div class="grid" id="inv"></div></div></section>
  <section id="story" class="view"><div class="card"><h3>일반 스테이지</h3><div class="small">첫 클리어 EXP 큼 · 반복 EXP 1/10 · 기본 재료 지속 드랍</div><div id="storyBtns" class="row" style="margin-top:10px"></div></div><div class="card"><div class="row space"><b id="storyName"></b><button class="primary" onclick="fightStory()">자동전투</button></div><div class="battle-stage"><div class="manduArt" id="storyMandu"></div><div class="vs">VS</div><div class="enemyArt" id="storyEnemy">🐭</div></div><div class="log" id="storyLog"></div></div></section>
  <section id="dungeon" class="view"><div class="zone"><div class="card"><h3>⛰️ 산 던전</h3><div class="small">약초·버섯·씨앗·꿀·산양유</div><p>최고 <b id="mb"></b>F</p><button onclick="chooseDungeon('m')">도전</button></div><div class="card"><h3>🌊 바다 던전</h3><div class="small">새우·조개·미역·오징어·장어</div><p>최고 <b id="sb"></b>F</p><button onclick="chooseDungeon('s')">도전</button></div></div><div class="card"><div class="row space"><b id="dTitle">던전을 선택해줘</b><button class="primary" id="dFight" onclick="fightDungeon()" disabled>자동전투</button></div><div class="battle-stage"><div class="manduArt" id="dungeonMandu"></div><div class="vs">VS</div><div class="enemyArt" id="dungeonEnemy">❔</div></div><div class="log" id="dLog"></div></div></section>
  <section id="kitchen" class="view"><div class="card"><h3>🌬️ 건조대</h3><div id="dry"></div></div><div class="card"><h3>🧊 숙성고</h3><div id="age"></div></div><div class="card"><h3>🍳 조리대</h3><div id="cook"></div></div><div class="small">실제 시간이 흐르고 ⏳ 세월의 조각으로 시간을 줄일 수 있음.</div></section>
  <section id="research" class="view"><div class="card"><h3>연구소</h3><div id="researchList"></div></div></section>
  <section id="dex" class="view"><div class="card"><div class="row space"><h3>식재료 도감</h3><b id="dexCount"></b></div><div class="grid" id="dexGrid"></div></div></section>
</div>
<nav class="tabs"><button class="tab active" data-v="home">🏠<br>홈</button><button class="tab" data-v="story">⚔️<br>전투</button><button class="tab" data-v="dungeon">🗺️<br>던전</button><button class="tab" data-v="kitchen">🍳<br>부엌</button><button class="tab" data-v="research">🔬<br>연구</button><button class="tab" data-v="dex">📚<br>도감</button></nav>
<script>
const I={chicken:{n:"닭고기",g:"일반",c:1,o:"공속 +8%",col:"#efd88e"},pork:{n:"돼지고기",g:"일반",c:2,o:"맛 +10%",atk:.10,col:"#eeb1aa"},garlic:{n:"마늘",g:"일반",c:1,o:"치확 +5%",crit:.05,col:"#f0e6b9"},chive:{n:"부추",g:"일반",c:1,o:"회복 +3",regen:3,col:"#77b866"},chili:{n:"고춧가루",g:"일반",c:1,o:"치피 +15%",cd:.15,col:"#d95045"},cabbage:{n:"배추",g:"일반",c:2,o:"체력 +12%",hp:.12,col:"#a7c676"},salt:{n:"소금",g:"일반",c:1,o:"스증 +8%",sa:.08,col:"#eee9df"},pepper:{n:"후추",g:"일반",c:1,o:"명중 +6%",col:"#65544b"},soy:{n:"간장",g:"일반",c:2,o:"최종피해 +5%",fin:.05,col:"#8b5b3d"},seed:{n:"씨앗",g:"일반",c:1,o:"회복 +2",regen:2,col:"#b08a4e"},mugwort:{n:"쑥",g:"일반",c:1,o:"공깎",col:"#688852"},mushroom:{n:"버섯",g:"고급",c:2,o:"상태적중 + 스증",sa:.05,col:"#9b7965"},honey:{n:"꿀",g:"고급",c:2,o:"치유량 + 보호막",regen:4,col:"#d8a52b"},goat:{n:"산양유",g:"고급",c:2,o:"회복 + 체력",regen:4,hp:.06,col:"#eee4cf"},ginseng:{n:"인삼",g:"희귀",c:3,o:"회복량↑ + 재생",regen:7,col:"#c79a62"},shrimp:{n:"새우",g:"고급",c:2,o:"스증 + 연속공격",sa:.08,multi:.10,col:"#ef8c6d"},clam:{n:"조개",g:"고급",c:2,o:"스증 + 상태저항",sa:.08,col:"#d1b6a3"},seaweed:{n:"미역",g:"일반",c:1,o:"방어",def:.06,col:"#4c7559"},squid:{n:"오징어",g:"고급",c:2,o:"스증 + 반격",sa:.08,counter:.10,col:"#c8a3b1"},eel:{n:"장어",g:"고급",c:3,o:"스증 + 지속회복",sa:.08,regen:5,col:"#806951"},salmon:{n:"연어",g:"고급",c:2,o:"스증 + 흡혈",sa:.08,life:.06,col:"#ef8b7c"},octopus:{n:"문어",g:"고급",c:3,o:"스증 + 다단히트",sa:.08,multi:.16,col:"#bd6d8b"},tuna:{n:"참치",g:"고급",c:3,o:"스증 + 보스관통",sa:.08,col:"#748da4"},drySeaweed:{n:"건미역",g:"고급",c:1,o:"스증 + 방어",sa:.05,def:.05,col:"#365944"},dryMushroom:{n:"말린버섯",g:"고급",c:1,o:"최종피해 +3%",fin:.03,col:"#7c5a47"},kimchi:{n:"김치",g:"고급",c:2,o:"치피 + 지속피해",cd:.08,col:"#d84f3f"},agedKimchi:{n:"묵은지",g:"희귀",c:3,o:"지속피해 + 방깎",fin:.06,col:"#9e3e31"}};
const icon=id=>({chicken:"🍗",pork:"🥩",garlic:"🧄",chive:"🌿",chili:"🌶️",cabbage:"🥬",salt:"🧂",pepper:"⚫",soy:"🥣",seed:"🌱",mugwort:"🍃",mushroom:"🍄",honey:"🍯",goat:"🥛",ginseng:"🌿",shrimp:"🦐",clam:"🐚",seaweed:"🌿",squid:"🦑",eel:"🐟",salmon:"🐟",octopus:"🐙",tuna:"🐟",drySeaweed:"🌿",dryMushroom:"🍄",kimchi:"🥬",agedKimchi:"🥬"}[id]||"🍽️");
const S=JSON.parse(localStorage.getItem("manduProto")||"null")||{gold:500,time:20,rp:5,lv:1,exp:0,equipped:[],inv:{garlic:3,chive:2,chili:2,salt:2,chicken:2,pork:1},dex:["garlic","chive","chili","salt","chicken","pork"],storyBest:0,storySel:0,mb:0,sb:0,dType:null,jobs:{dry:null,age:null,cook:null},up:{dry:0,age:0,combat:0}};
const save=()=>localStorage.setItem("manduProto",JSON.stringify(S)),maxCap=()=>Math.min(10,6+Math.floor((S.lv-1)/5)),used=()=>S.equipped.reduce((a,id)=>a+I[id].c,0),needExp=()=>100+(S.lv-1)*35;
function add(id,n=1){S.inv[id]=(S.inv[id]||0)+n;if(!S.dex.includes(id))S.dex.push(id)}
function stats(){let x={hp:100,atk:10,crit:.05,cd:1.5,regen:0,sa:0,fin:0,def:0,multi:0,counter:0,life:0};for(const id of S.equipped){const a=I[id];if(a.hp)x.hp*=1+a.hp;if(a.atk)x.atk*=1+a.atk;if(a.crit)x.crit+=a.crit;if(a.cd)x.cd+=a.cd;if(a.regen)x.regen+=a.regen;if(a.sa)x.sa+=a.sa;if(a.fin)x.fin+=a.fin;if(a.def)x.def+=a.def;if(a.multi)x.multi+=a.multi;if(a.counter)x.counter+=a.counter;if(a.life)x.life+=a.life}x.hp*=1+S.up.combat*.02;x.atk*=1+S.up.combat*.02;return x}
function mix(){const cs=S.equipped.map(id=>I[id].col);if(!cs.length)return"#eee2c9";let t=[0,0,0];cs.forEach(c=>{t[0]+=parseInt(c.slice(1,3),16);t[1]+=parseInt(c.slice(3,5),16);t[2]+=parseInt(c.slice(5,7),16)});return"#"+t.map(v=>Math.round(v/cs.length).toString(16).padStart(2,"0")).join("")}
function role(){const s=stats();const summon=S.equipped.filter(x=>["seed","mushroom","seaweed"].includes(x)).length;if(summon>=3)return"히든 클래스 · 소환사";if(s.regen>=7)return"회복형";if(s.def>=.08||s.hp>=125)return"방어형";if(s.sa>=.16)return"스킬딜러";if(s.crit>=.12||s.cd>=1.75)return"폭딜러";return"자유 레시피"}
function gainExp(v){S.exp+=v;while(S.exp>=needExp()){S.exp-=needExp();S.lv++;S.gold+=100}}
function equip(id){if(!S.inv[id])return;if(used()+I[id].c>maxCap())return alert("재료 용량 부족");S.inv[id]--;S.equipped.push(id);render()}function unequip(i){if(confirm(I[S.equipped[i]].n+"을 빼면 소멸해. 제거할까?")){S.equipped.splice(i,1);render()}}function starter(){["garlic","chive","chili","salt","pepper","chicken","pork"].forEach(id=>add(id));render()}
const story=[{n:"1-1 밀가루 창고",hp:80,atk:6,exp:90,d:["garlic","chive"]},{n:"1-2 정육점 뒷골목",hp:115,atk:8,exp:110,d:["chicken","pork"]},{n:"1-3 채소 가게",hp:150,atk:10,exp:135,d:["cabbage","chive"]},{n:"1-4 양념 창고",hp:195,atk:12,exp:165,d:["salt","pepper","chili"]},{n:"1-5 시장의 대장쥐",hp:270,atk:15,exp:220,d:["soy","pork","chili"],boss:true}];
function sim(e,el){const s=stats();let hp=s.hp,eh=e.hp,turn=0,L=[];while(hp>0&&eh>0&&turn++<60){let dmg=s.atk*(.9+Math.random()*.2);if(Math.random()<s.crit){dmg*=s.cd;L.push("💥 풍미 폭발!")}if(turn%3===0)dmg*=1.5*(1+s.sa);if(Math.random()<s.multi)dmg*=1.7;dmg*=1+s.fin;eh-=dmg;L.push(`🥟 맛 ${dmg.toFixed(0)} → 적 ${Math.max(0,eh).toFixed(0)}`);if(eh<=0)break;let ed=e.atk*(.85+Math.random()*.3)*(1-Math.min(.5,s.def));hp-=ed;if(s.regen)hp=Math.min(s.hp,hp+s.regen);if(Math.random()<s.counter){eh-=s.atk*.6;L.push("↩️ 반격!")}if(s.life)hp=Math.min(s.hp,hp+dmg*s.life);L.push(`👾 피격 ${ed.toFixed(0)} → 내 ${Math.max(0,hp).toFixed(0)}`)}el.innerHTML=L.slice(-70).join("<br>");return hp>0&&eh<=0}

function animateMandu(kind){
  const cls={attack:"motion-attack",hit:"motion-hit",win:"motion-win"}[kind];
  ["mandu","storyMandu","dungeonMandu"].forEach(id=>{
    const el=document.getElementById(id); if(!el||!cls)return;
    el.classList.remove("motion-attack","motion-hit","motion-win");
    void el.offsetWidth; el.classList.add(cls);
    setTimeout(()=>el.classList.remove(cls),900);
  });
}
function updateBattleArt(){
  const se=document.getElementById("storyEnemy");
  if(se){ const em=["🐭","🐀","🥬","🦂","👹"]; se.textContent=em[S.storySel]||"🐭"; }
  const de=document.getElementById("dungeonEnemy");
  if(de){
    if(!S.dType) de.textContent="❔";
    else {
      const f=(S.dType==="m"?S.mb:S.sb)+1;
      de.textContent=S.dType==="m"?(f<11?"🐇":f<21?"🐐":"🦌"):(f<11?"🦐":f<21?"🦑":"🐙");
    }
  }
}

function fightStory(){animateMandu('attack');const st=story[S.storySel],el=document.getElementById("storyLog"),win=sim(st,el);if(win){const first=S.storySel>=S.storyBest,ex=first?st.exp:Math.max(1,Math.floor(st.exp/10));gainExp(ex);S.gold+=first?80:15;const id=st.d[Math.floor(Math.random()*st.d.length)];add(id);if(first&&S.storyBest<story.length-1)S.storyBest++;if(first){S.time+=2;S.rp+=1}el.innerHTML+=`<br><b>승리! EXP +${ex} · ${I[id].n} 획득</b>`}else {animateMandu("hit");el.innerHTML+="<br><b>패배</b>"};if(win)animateMandu("win");render()}
function chooseDungeon(t){S.dType=t;render()}function pool(t,f){if(t==="m"){if(f>=21)return["ginseng","goat","honey"];if(f>=11)return["mushroom","honey","goat"];return["seed","mugwort","mushroom"]}else{if(f>=21)return["octopus","tuna","salmon"];if(f>=11)return["squid","eel","salmon"];return["shrimp","clam","seaweed"]}}
function fightDungeon(){animateMandu('attack');const best=S.dType==="m"?S.mb:S.sb,f=Math.min(30,best+1),boss=f%10===0,el=document.getElementById("dLog");const win=sim({hp:90+f*18+(boss?150:0),atk:6+f*.8+(boss?5:0)},el);if(win){const p=pool(S.dType,f),id=p[Math.floor(Math.random()*p.length)];add(id,boss?2:1);S.gold+=20+f*2;if(boss){S.time+=3;S.rp++}if(S.dType==="m")S.mb=Math.max(S.mb,f);else S.sb=Math.max(S.sb,f);el.innerHTML+=`<br><b>클리어! ${I[id].n} 획득</b>`}else {animateMandu("hit");el.innerHTML+="<br><b>패배</b>"};if(win)animateMandu("win");render()}
const rec={dry:[{n:"미역 말리기",need:{seaweed:1},out:"drySeaweed",sec:45},{n:"버섯 말리기",need:{mushroom:1},out:"dryMushroom",sec:60}],cook:[{n:"김치 담그기",need:{cabbage:1,chili:1,garlic:1,salt:1},out:"kimchi",sec:40}],age:[{n:"김치 숙성 → 묵은지",need:{kimchi:1},out:"agedKimchi",sec:120}]};
function startJob(type,i){const r=rec[type][i];for(const [id,n] of Object.entries(r.need))if((S.inv[id]||0)<n)return alert(I[id].n+" 부족");for(const [id,n] of Object.entries(r.need))S.inv[id]-=n;const cut=type==="dry"?S.up.dry*.05:type==="age"?S.up.age*.05:0;S.jobs[type]={n:r.n,out:r.out,end:Date.now()+r.sec*1000*(1-cut)};render()}function speed(type){if(S.time<10)return alert("세월의 조각 부족");if(!S.jobs[type])return;S.time-=10;S.jobs[type].end-=10000;render()}
function renderJobs(type){const el=document.getElementById(type),j=S.jobs[type];if(j){const rem=Math.max(0,Math.ceil((j.end-Date.now())/1000));if(rem<=0){add(j.out);S.jobs[type]=null;save();return renderJobs(type)}el.innerHTML=`<div class="item"><b>${j.n}</b><div>${rem}초 남음</div><button onclick="speed('${type}')">⏳10 사용</button></div>`}else{el.innerHTML=rec[type].map((r,i)=>`<div class="item"><b>${r.n}</b><div class="small">${Object.entries(r.need).map(([id,n])=>I[id].n+" x"+n).join(" + ")} · ${r.sec}초</div><button onclick="startJob('${type}',${i})">시작</button></div>`).join("")}}
function upgrade(k){const cost=1+S.up[k];if(S.rp<cost)return alert("연구재화 부족");S.rp-=cost;S.up[k]++;render()}
function render(){document.getElementById("gold").textContent=S.gold;document.getElementById("time").textContent=S.time;document.getElementById("rp").textContent=S.rp;document.getElementById("lv").textContent=S.lv;document.getElementById("expText").textContent=S.exp+"/"+needExp();document.getElementById("expBar").style.width=(S.exp/needExp()*100)+"%";document.getElementById("used").textContent=used();document.getElementById("max").textContent=maxCap();document.getElementById("role").textContent=role();document.getElementById("mandu").style.setProperty("--c",mix());const st=stats();document.getElementById("statText").textContent=`맛 ${st.atk.toFixed(1)} · HP ${Math.round(st.hp)} · 치확 ${Math.round(st.crit*100)}% · 스증 ${Math.round(st.sa*100)}%`;document.getElementById("name").textContent=S.equipped.length?I[S.equipped[0]].n+"향 만두":"기본만두";document.getElementById("equip").innerHTML=S.equipped.map((id,i)=>`<button class="slot" onclick="unequip(${i})">${icon(id)}</button>`).join("")+`<div class="slot">+</div>`;document.getElementById("inv").innerHTML=Object.keys(I).filter(id=>(S.inv[id]||0)>0).map(id=>`<div class="item"><b>${icon(id)} ${I[id].n}</b><span style="float:right">x${S.inv[id]}</span><div class="small">${I[id].g} · 용량 ${I[id].c}<br>${I[id].o}</div><button ${used()+I[id].c>maxCap()?"disabled":""} onclick="equip('${id}')">넣기</button></div>`).join("");document.getElementById("storyBtns").innerHTML=story.map((x,i)=>`<button ${i>S.storyBest?"disabled":""} onclick="S.storySel=${i};render()">${x.n.split(" ")[0]}</button>`).join("");document.getElementById("storyName").textContent=story[S.storySel].n;document.getElementById("mb").textContent=S.mb;document.getElementById("sb").textContent=S.sb;document.getElementById("dFight").disabled=!S.dType;document.getElementById("dTitle").textContent=!S.dType?"던전을 선택해줘":(S.dType==="m"?"⛰️ 산 던전 ":"🌊 바다 던전 ")+((S.dType==="m"?S.mb:S.sb)+1)+"F";renderJobs("dry");renderJobs("age");renderJobs("cook");document.getElementById("researchList").innerHTML=[["dry","건조 연구","건조시간 5% 감소/레벨"],["age","숙성 연구","숙성시간 5% 감소/레벨"],["combat","기초 미각 연구","맛·체력 2% 증가/레벨"]].map(([k,n,d])=>`<div class="item"><b>${n} Lv.${S.up[k]}</b><div class="small">${d}</div><button onclick="upgrade('${k}')">연구 ${1+S.up[k]} 사용</button></div>`).join("");document.getElementById("dexGrid").innerHTML=Object.keys(I).map(id=>`<div class="item" style="${S.dex.includes(id)?"":"opacity:.4;filter:grayscale(1)"}"><div style="font-size:25px">${S.dex.includes(id)?icon(id):"❓"}</div><b>${S.dex.includes(id)?I[id].n:"미발견"}</b><div class="small">${S.dex.includes(id)?I[id].o:"???"}</div></div>`).join("");document.getElementById("dexCount").textContent=S.dex.length+"/"+Object.keys(I).length;updateBattleArt();save()}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));document.getElementById(b.dataset.v).classList.add("active");render()});setInterval(()=>{if(document.getElementById("kitchen").classList.contains("active")){renderJobs("dry");renderJobs("age");renderJobs("cook")}},1000);render();
</script>
